name: Build J.A.X. Native Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Find Project Directory & Build APK
        run: |
          # Locate directory containing settings.gradle or settings.gradle.kts
          BUILD_DIR=$(find . -name "settings.gradle*" -exec dirname {} \; | head -n 1)
          
          if [ -z "$BUILD_DIR" ]; then
            echo "ERROR: Could not find settings.gradle anywhere in the repository!"
            exit 1
          fi
          
          echo "Found Android project in: $BUILD_DIR"
          cd "$BUILD_DIR"
          
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JAX-Native-APK
          path: '**/build/outputs/apk/debug/*.apk'
